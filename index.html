<title>Конструктор бланков — Ванильное небо</title>

  h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
  .ai-zone { background: #e8f4fd; border: 2px dashed #3498db; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
  .ai-zone textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; resize: vertical; font-family: inherit; }
  .ai-zone button { background: #3498db; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; }
  #parse-status { display: inline-block; margin-left: 12px; font-size: 13px; font-weight: bold; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .fg { display: flex; flex-direction: column; }
  label { font-weight: bold; font-size: 13px; color: #555; margin-bottom: 4px; }
  input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; width: 100%; }
  .tabs { display: flex; gap: 6px; margin: 20px 0 12px; border-bottom: 2px solid #ddd; padding-bottom: 8px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border: none; background: #e0e0e0; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 13px; }
  .tab.active { background: #3498db; color: white; }
  .pane { display: none; }
  .pane.active { display: block; }
  .row { display: grid; grid-template-columns: 24px 1fr 90px 90px 40px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .drag-handle { cursor: grab; text-align: center; color: #aaa; font-size: 16px; font-weight: bold; user-select: none; -webkit-user-select: none; padding: 8px 0; border-radius: 3px; }
  .drag-handle:hover { background: #f0f0f0; color: #555; }
  .row.dragging { opacity: 0.4; background: #f5faff; }
  .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
  .add { background: #2ecc71; color: #fff; margin-top: 4px; }
  .del { background: #e74c3c; color: #fff; }
  .big { display: block; width: 100%; margin-top: 20px; padding: 15px; background: #3498db; color: #fff; font-size: 16px; }
  .download { display: block; width: 100%; margin-top: 15px; padding: 18px; background: #27ae60; color: #fff; font-size: 18px; border-radius: 4px; }
  .copy { display: block; width: 100%; margin-top: 8px; padding: 12px; background: #9b59b6; color: #fff; font-size: 14px; }
  .excel-btn { display: block; width: 100%; margin-top: 12px; padding: 14px; background: #1e88e5; color: #fff; font-size: 15px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }

<body>
<div class="container">
  <h2>Конструктор бланков «Ванильное небо»</h2>

  <div class="ai-zone">
    <label style="font-size:15px;color:#2c3e50;">⚡ Вставь сюда текст заявки:</label>
    <textarea id="ai-input" placeholder="Например: меню обед 22 числа Ярослав Оливье, борщ, пюре картофельное, котлета пожарская, морс (21 чел.+гид)"></textarea>
    <button onclick="parseIncomingText()">🔎 Распознать текст</button>
    <span id="parse-status"></span>
  </div>

  <div class="grid">
    <div class="fg"><label>Турфирма:</label><input type="text" id="firm" value="" placeholder="Впишите вручную" oninput="updateAccMsg()"></div>
    <div class="fg"><label>Дата:</label><input type="text" id="date" value=""></div>
    <div class="fg"><label>Время:</label><input type="text" id="time" value=""></div>
  </div>

  <div class="grid">
    <div class="fg"><label>Оплата:</label><input type="text" id="payment" value="?"></div>
    <div class="fg"><label>Кол-во (текстом):</label><input type="text" id="cntText" value="" oninput="onCntTextInput()"></div>
    <div class="fg"><label>Всего порций:</label><input type="number" id="cntTotal" value="0" oninput="recalc()"></div>
  </div>

  <div class="grid">
    <div class="fg"><label>Цена сета на 1 чел:</label><input type="number" id="pBase" value="680" oninput="recalc()"></div>
    <div class="fg"><label>Доп. плата вручную на 1 чел:</label><input type="number" id="pExtra" value="0" oninput="recalc()"></div>
    <div class="fg"><label>Итого:</label><input type="text" id="total" value="" readonly style="background:#eee;color:#27ae60;font-weight:bold;"></div>
  </div>

  <div class="price-info" id="price-info">💰 Цена: 680₽</div>

  <div class="tabs">
    <button class="tab active" data-tab="main" onclick="switchTab(this)">Основное меню</button>
    <button class="tab" data-tab="trap" onclick="switchTab(this)">Трапеза по-Ярославски</button>
    <button class="tab" data-tab="kids" onclick="switchTab(this)">Детское меню</button>
    <button class="tab" data-tab="add" onclick="switchTab(this)">Десерты и настойки (доплата)</button>
  </div>

  <div id="pane-main" class="pane active"><div class="rows"></div><button class="btn add" onclick="addRow('main')">+ Добавить блюдо</button></div>
  <div id="pane-trap" class="pane"><div class="rows"></div><button class="btn add" onclick="addRow('trap')">+ Добавить блюдо</button></div>
  <div id="pane-kids" class="pane"><div class="rows"></div><button class="btn add" onclick="addRow('kids')">+ Добавить блюдо</button></div>
  <div id="pane-add" class="pane"><div class="rows"></div><button class="btn add" onclick="addRow('add')">+ Добавить блюдо</button></div>

  <button class="btn big" onclick="generate()">Сформировать два бланка (предпросмотр)</button>
  <button class="btn download" onclick="downloadWord()">📥 Скачать Word-файл (2 бланка на 1 листе)</button>
  <button class="btn copy" onclick="copyResult()">📋 Или скопировать всё для Word</button>
  <button class="excel-btn" onclick="copyExcelRow()">📊 Строка для Excel</button>

  <div class="acc-zone">
    <label>💬 Сообщение бухгалтеру (Макс):</label>
    <textarea id="acc-msg" readonly placeholder="Заполните турфирму, количество и цену"></textarea>
    <button class="acc-copy" onclick="copyAccMsg()">📋 Скопировать сообщение бухгалтеру</button>
  </div>

  <div id="preview"><div id="output" style="background:#fff;padding:15px;"></div></div>
</div>

/* ========= МАРКЕРЫ КАТЕГОРИЙ ========= */
// Уникальные блюда детского меню (нет в основном/трапезе)
const KIDS_MARKERS = ["бризоль","оливье с курицей","оливье из курицы","спагетти","шницель","маффин","тефтели",
  "суп с вермишелью","суп картофельный","кольцо заварное","котлета по домашнему","каша овсяная на молоке",
  "блины с джемом","блины со сметаной"];
// Уникальные блюда Трапезы (нет в основном/детском)
const TRAP_MARKERS = ["разсол","похлебка","калья","тельное","судак","курник","студень","рулет из курицы",
  "хлебная корзина","щи суточные","щи из щавеля","котлета из щуки","котлета пожарского","телятина томленая",
  "салат из огородных овощей","капуста квашеная"];

function detectCategory(textNorm) {
  // Проверяем маркеры детского
  for (const mk of KIDS_MARKERS) {
    const nm = normStr(mk);
    if (containsPhrase(textNorm, nm)) return 'kids';
  }
  // Маркеры трапезы
  for (const mk of TRAP_MARKERS) {
    const nm = normStr(mk);
    if (containsPhrase(textNorm, nm)) return 'trap';
  }
  return 'main';
}

// Приводим все найденные блюда к выбранной категории
// Если блюдо есть в главной категории (по 2-3 ключевым словам) — берём оттуда
function mapToCategory(list, domCat) {
  const domDishes = DB[domCat] || [];
  const result = [];
  const usedKeys = new Set();

  // Сначала проходим по найденным блюдам
  for (const item of list) {
    if (item.cat === 'add') { result.push(item); continue; }

    const first3 = normStr(cleanDishName(item.name)).split(' ').slice(0, 3).join(' ');
    const first2 = normStr(cleanDishName(item.name)).split(' ').slice(0, 2).join(' ');
    const first1 = normStr(cleanDishName(item.name)).split(' ')[0];

    // Пробуем найти в главной категории: сначала по 3 словам, потом по 2, потом по 1
    let alt = domDishes.find(x => normStr(cleanDishName(x.n)).startsWith(first3));
    if (!alt && first2) alt = domDishes.find(x => normStr(cleanDishName(x.n)).startsWith(first2));
    if (!alt && first1) alt = domDishes.find(x => normStr(cleanDishName(x.n)).startsWith(first1));

    if (alt) {
      const key = normStr(cleanDishName(alt.n));
      if (!usedKeys.has(key)) {
        usedKeys.add(key);
        result.push({ cat: domCat, name: alt.n, w: alt.w, cn: key });
      }
    } else {
      // Не нашли в главной категории — оставляем как есть
      const key = normStr(cleanDishName(item.name));
      if (!usedKeys.has(key)) {
        usedKeys.add(key);
        result.push(item);
      }
    }
  }
  return result;
}

/* ========= АВТО-ЦЕНА ========= */
function isSoup(name) {
  const n = normStr(cleanDishName(name));
  return /^суп|^борщ|^щи|^солянка|^уха|^окрошка|^рассольник|похлебка|^калья/.test(n);
}

function detectPrice(cat, hasSoup) {
  if (cat === 'trap') {
    return hasSoup ? {price:1850, label:'Трапеза по-Ярославски (с супом)'}
                   : {price:1300, label:'Трапеза по-Ярославски (без супа)'};
  }
  if (cat === 'kids') {
    return hasSoup ? {price:710, label:'Детский обед (с супом)'}
                   : {price:600, label:'Детский ужин (без супа)'};
  }
  // main — основной или расширенный
  // Определяем расширенный по уникальным блюдам
  return null; // определим позже по блюдам
}

function isExtendedDish(name) {
  const n = normStr(cleanDishName(name));
  if (/^салат овощной с кунжутом|^салат домашний|^салат столичный|салат нежность|^оливье с ветчиной/.test(n)) return true;
  if (/^цезарь|^салат цезарь/.test(n)) return true;
  if (/борщ с говядиной|борщ говяжий|борщ сибирский|^солянка|уха по царски|уха царская|уха из трех/.test(n)) return true;
  if (/свинина запеченная|свинина пикантная|бефстроганов|^гуляш|филе куриное|фрикасе|фрикассе|биточек|минтай/.test(n)) return true;
  return false;
}

function isBreakfastSet(names) {
  const hasKasha = names.some(n => /каша/i.test(n));
  const hasVtoroe = names.some(n => /омлет|блины|сырники/i.test(n));
  const hasDrink = names.some(n => /^чай|^морс|^кофе/i.test(n));
  const hasOther = names.some(n => /салат|суп|борщ|горячее|котлет|филе|пюре|рис |рагу|хлеб/i.test(n));
  return hasKasha && hasVtoroe && hasDrink && !hasOther;
}

let manualSortDone = false;

function normStr(s) {
  return String(s).toLowerCase().replace(/ё/g,'е').replace(/[«»"'`()\-–—.,:;!?\/\\\[\]]/g,' ').replace(/\s+/g,' ').trim();
}
function cleanDishName(name) {
  return String(name).replace(/\s*—\s*\d+₽\s*$/,'').replace(/\s*\(\d+\)\s*$/,'').trim();
}
function getDessertPrice(name) {
  const m = String(name).match(/—\s*(\d+)\s*₽/);
  return m ? parseInt(m[1]) : 0;
}
function containsPhrase(h, n) {
  if (!n) return false;
  const esc = n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('(^|\\s)'+esc+'(?=\\s|$)','i').test(h);
}
function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function dessertPerPersonTotal() {
  let s = 0;
  document.querySelectorAll('.row').forEach(r => {
    if (r.getAttribute('data-cat') !== 'add') return;
    const name = r.querySelector('select').value;
    if (name) s += getDessertPrice(name);
  });
  return s;
}

function dishOrder(name) {
  let n = normStr(cleanDishName(name));
  n = n.replace(/^детский\s+/, '').replace(/^детское\s+/, '').replace(/^детская\s+/, '');
  if (/эклер|медовик|опера|брауни|прага|бархат|настойк|сет из/.test(n)) return 90;
  if (/^салат|^винегрет|^оливье|разсол/.test(n)) return 10;
  if (/рулет из курицы|^студень|капуста квашеная|^курник/.test(n)) return 15;
  if (/^суп|^борщ|^щи|^солянка|^уха|^окрошка|^рассольник|похлебка|^калья/.test(n)) return 20;
  if (/^картофель|^картошка|картофельное пюре|^пюре|^рис |^рис$|^рагу|^капуста тушеная|^греча|^спагетти/.test(n)) return 40;
  if (/котлет|зраз|филе|фрикасе|фрикассе|гуляш|бефстроганов|свинин|телятин|биточ|шницель|бризоль|судак|тельное|пожарск|жарен|запечен/.test(n)) return 30;
  if (/пирожок/.test(n)) return 50;
  if (/хлеб|корзин/.test(n)) return 60;
  if (/^чай|^морс|^кофе|напит/.test(n)) return 70;
  return 35;
}

function collectRowsSorted() {
  const all = Array.from(document.querySelectorAll('.row'));
  if (manualSortDone) return all;
  return all.slice().sort((a, b) => {
    const na = a.querySelector('select').value;
    const nb = b.querySelector('select').value;
    if (!na && !nb) return 0;
    if (!na) return 1;
    if (!nb) return -1;
    return dishOrder(na) - dishOrder(nb);
  });
}

let draggingRow = null;
let dragStarted = false;

function makeDraggable(row) {
  const handle = row.querySelector('.drag-handle');
  if (!handle) return;
  handle.addEventListener('mousedown', () => { row.draggable = true; dragStarted = false; });
  handle.addEventListener('mouseup', () => {
    setTimeout(() => { if (!dragStarted) row.draggable = false; }, 50);
  });
  row.addEventListener('dragstart', (e) => {
    dragStarted = true; draggingRow = row; row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', ''); } catch(err) {}
  });
  row.addEventListener('dragend', () => {
    draggingRow = null; dragStarted = false; row.draggable = false;
    row.classList.remove('dragging'); manualSortDone = true;
  });
  row.addEventListener('dragover', (e) => {
    if (!draggingRow || draggingRow === row) return;
    if (draggingRow.parentNode !== row.parentNode) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) row.parentNode.insertBefore(draggingRow, row);
    else row.parentNode.insertBefore(draggingRow, row.nextSibling);
  });
  row.addEventListener('drop', (e) => { e.preventDefault(); });
}

function findFirmInText(textNorm) {
  const sorted = KNOWN_FIRMS.slice().sort((a,b) => b.length - a.length);
  for (const name of sorted) {
    const an = normStr(name);
    if (containsPhrase(textNorm, an)) return name;
  }
  return '';
}

function onCntTextInput() {
  const val = document.getElementById('cntText').value.trim();
  let sum = 0, found = false;
  const mSum = val.match(/(\d+)\s*\+\s*(\d+)/);
  if (mSum) { sum = parseInt(mSum[1]) + parseInt(mSum[2]); found = true; }
  else { const mOne = val.match(/(\d+)/); if (mOne) { sum = parseInt(mOne[1]); found = true; } }
  if (found && sum > 0) {
    document.getElementById('cntTotal').value = sum;
    recalc();
  }
}

function updateAccMsg() {
  const firm = document.getElementById('firm').value.trim();
  const cnt = parseInt(document.getElementById('cntTotal').value) || 0;
  const base = parseInt(document.getElementById('pBase').value) || 0;
  const manualExtra = parseInt(document.getElementById('pExtra').value) || 0;
  const dessertPP = dessertPerPersonTotal();
  const pricePerPerson = base + manualExtra + dessertPP;

function copyExcelRow() {

function parseIncomingText() {
  const status = document.getElementById('parse-status');
  const priceInfo = document.getElementById('price-info');
  status.textContent = '';
  const warnings = [];
  manualSortDone = false;
  try {
    const raw = document.getElementById('ai-input').value;
    if (!raw.trim()) { alert('Вставь текст заявки.'); return; }
    const flat = raw.replace(/\s+/g,' ').trim();
    const textNorm = normStr(flat);

    // ТУРФИРМА
    const detectedFirm = findFirmInText(textNorm);
    document.getElementById('firm').value = detectedFirm;
    if (!detectedFirm) warnings.push('турфирма');

    // ДАТА
    let dateStr = '';
    let m = flat.match(/дата\s*:?\s*(\d{1,2}[.\-\/]\d{1,2}(?:[.\-\/]\d{2,4})?)/i);
    if (m) dateStr = m[1];
    if (!dateStr) {
      const dm = flat.match(/\b(\d{1,2}[.\-\/]\d{1,2}(?:[.\-\/]\d{2,4})?)\b/);
      if (dm) dateStr = dm[1];
    }
    if (!dateStr) {
      const dn = flat.match(/(\d{1,2})\s+числа/i);
      if (dn) dateStr = String(dn[1]).padStart(2,'0');
    }
    if (!dateStr) {
      const mm = flat.match(/(\d{1,2})\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)/i);
      if (mm) {
        const map = { январ:'01', феврал:'02', март:'03', апрел:'04', ма:'05', мая:'05', июн:'06', июл:'07', август:'08', сентябр:'09', октябр:'10', ноябр:'11', декабр:'12' };
        let key = mm[2].toLowerCase().substring(0,5);
        for (const k of Object.keys(map)) { if (key.startsWith(k.substring(0,3))) { key = k; break; } }
        if (map[key]) dateStr = String(mm[1]).padStart(2,'0') + '.' + map[key];
      }
    }
    if (dateStr) document.getElementById('date').value = dateStr;

    // ВРЕМЯ
    m = flat.match(/\b(\d{1,2}:\d{2})\b/);
    if (m) document.getElementById('time').value = m[1];

    // ОПЛАТА
    m = flat.match(/оплата\s*:?\s*([^\s,.;]+)/i);
    if (m) {
      let pay = m[1].toLowerCase().trim().replace(/\\/g,'/');
      if (pay === 'рс' || pay === 'р/с') pay = 'р/с';
      document.getElementById('payment').value = pay;
    } else {
      document.getElementById('payment').value = '?';
    }

    // КОЛИЧЕСТВО
    let total = 0;
    let cntTextStr = '';
    const detailInner = flat.match(/\(([^)]*?(?:гид|водител)[^)]*?)\)/i);
    if (detailInner) {
      const inner = detailInner[1];
      const nums = inner.match(/\d+/g) || [];
      const stInner = (/гид/i.test(inner)?1:0) + (/водител/i.test(inner)?1:0);
      if (nums.length) {
        const tour = parseInt(nums[0]);
        cntTextStr = tour + ' + ' + stInner;
        total = tour + stInner;
      }
    }
    if (!cntTextStr) {
      const detail = flat.match(/(\d+)\s*\(([^)]*)\)/);
      if (detail && /(гид|водител)/i.test(detail[2])) {
        const inner = detail[2];
        const nums = inner.match(/\d+/g) || [];
        const stInner = (/гид/i.test(inner)?1:0) + (/водител/i.test(inner)?1:0);
        const tour = nums.length ? parseInt(nums[0]) : (parseInt(detail[1]) - stInner);
        cntTextStr = tour + ' + ' + stInner;
        total = tour + stInner;
      }
    }
    if (!cntTextStr) {
      const staff = (/гид/i.test(flat) ? 1 : 0) + (/водител/i.test(flat) ? 1 : 0);
      if (staff > 0) {
        const mm = flat.match(/(\d+)\s*турист[а-я]*/i);
        if (mm) { const t = parseInt(mm[1]); cntTextStr = t + ' + ' + staff; total = t + staff; }
      }
    }
    if (!cntTextStr) {
      m = flat.match(/(?:кол-?ву\s+человек|кол-?во|количество(?:\s+человек)?|на\s+группу|групп[аеуы]?|человек|гостей|гост[ья]|туристов|турист)\s*:?\s*(\d+)(?:\s*\+\s*(\d+))?/i);
      if (m) {
        const n1 = parseInt(m[1]); const n2 = m[2] ? parseInt(m[2]) : 0;
        if (n2 > 0) { cntTextStr = n1 + ' + ' + n2; total = n1 + n2; }
        else { cntTextStr = String(n1); total = n1; }
      }
    }
    if (!cntTextStr) {
      m = flat.match(/\b(\d{1,3})\s*\+\s*(\d{1,2})\b/);
      if (m) {
        const after = flat.slice(m.index + m[0].length, m.index + m[0].length + 15);
        if (!/руб/i.test(after)) { cntTextStr = m[1] + ' + ' + m[2]; total = parseInt(m[1]) + parseInt(m[2]); }
      }
    }
    if (!total) {
      m = flat.match(/\b(\d+)\s*(?:человек|чел|гост|турист)/i);
      if (m) { total = parseInt(m[1]); cntTextStr = String(total); }
    }
    if (total) {
      document.getElementById('cntTotal').value = total;
      document.getElementById('cntText').value = cntTextStr || '';
    }

    // ==================== ОПРЕДЕЛЯЕМ КАТЕГОРИЮ ЗАЯВКИ ====================
    const domCat = detectCategory(textNorm);
    const catName = {main:'основное меню', trap:'Трапеза по-Ярославски', kids:'детское меню'}[domCat];

    // ==================== ИЩЕМ БЛЮДА ====================
    document.querySelectorAll('.row').forEach(r => r.remove());
    const fullMatches = [], fullNames = [];
    for (const cat of Object.keys(DB)) {
      for (const dish of DB[cat]) {
        const clean = cleanDishName(dish.n);
        const cn = normStr(clean);
        if (cn && containsPhrase(textNorm, cn)) {
          fullMatches.push({cat, name: dish.n, w: dish.w});
          fullNames.push({cat, name: dish.n, cn});
        }
      }
    }
    const aliasMatches = [];
    for (const cat of Object.keys(DB)) {
      for (const dish of DB[cat]) {
        const clean = cleanDishName(dish.n);
        const cn = normStr(clean);
        if (fullNames.some(f => f.cn === cn)) continue;
        if (!dish.a) continue;
        for (const al of dish.a) {
          const an = normStr(al);
          if (!an) continue;
          let swallowed = false;
          for (const f of fullNames) {
            if (f.cn === an || f.cn.includes(' '+an+' ') || f.cn.startsWith(an+' ') || f.cn.endsWith(' '+an)) { swallowed = true; break; }
          }
          if (swallowed) continue;
          if (containsPhrase(textNorm, an)) { aliasMatches.push({cat, name: dish.n, w: dish.w}); break; }
        }
      }
    }
    let all = fullMatches.concat(aliasMatches);
    const seen = new Set();
    all = all.filter(d => { const k = normStr(cleanDishName(d.name)); if (seen.has(k)) return false; seen.add(k); return true; });
    const norm = all.map(d => ({...d, cn: normStr(cleanDishName(d.name))}));
    let list = [];
    for (let i = 0; i < norm.length; i++) {
      let isInside = false;
      for (let j = 0; j < norm.length; j++) {
        if (i === j) continue;
        if (norm[j].cn.length > norm[i].cn.length && norm[j].cn.includes(norm[i].cn)) { isInside = true; break; }
      }
      if (!isInside) list.push(norm[i]);
    }

    // ==================== ПРИВОДИМ К КАТЕГОРИИ ====================
    list = mapToCategory(list, domCat);
    list.sort((a, b) => dishOrder(a.name) - dishOrder(b.name));

    // ==================== АВТО-ЦЕНА ====================
    const names = list.map(d => d.name);
    const hasSoup = names.some(isSoup);
    let priceResult;
    if (isBreakfastSet(names) && domCat === 'main') {
      priceResult = {price:420, label:'Завтрак (каша + второе + напиток)'};
    } else if (domCat === 'trap') {
      priceResult = hasSoup ? {price:1850, label:'Трапеза по-Ярославски (с супом)'}
                            : {price:1300, label:'Трапеза по-Ярославски (без супа)'};
    } else if (domCat === 'kids') {
      priceResult = hasSoup ? {price:710, label:'Детский обед (с супом)'}
                            : {price:600, label:'Детский ужин (без супа)'};
    } else {
      const hasExt = names.some(isExtendedDish);
      if (hasExt) priceResult = hasSoup ? {price:920, label:'Расширенный сет (с супом)'}
                                        : {price:720, label:'Расширенный сет (без супа)'};
      else priceResult = hasSoup ? {price:680, label:'Базовый сет (с супом)'}
                                 : {price:620, label:'Базовый сет (без супа)'};
    }
    document.getElementById('pBase').value = priceResult.price;
    priceInfo.textContent = '💰 Категория: ' + catName + ' · Цена: ' + priceResult.price + '₽ (' + priceResult.label + ')';
    priceInfo.classList.remove('warn');

    const log = [];
    list.forEach(d => { addRowWithData(d.cat, d.name, d.w); log.push(cleanDishName(d.name)); });
    recalc();

    let statusStr = list.length === 0 ? '⚠ Ничего не найдено.' : '✓ Категория: ' + catName + '. Найдено ' + list.length + ': ' + log.join(', ');
    if (warnings.length > 0) statusStr += ' | ⚠ не найдено: ' + warnings.join(', ');
    status.style.color = (list.length === 0 || warnings.length > 0) ? '#e67e22' : '#27ae60';
    status.textContent = statusStr;
  } catch (e) {
    console.error(e);
    status.style.color = '#e74c3c';
    status.textContent = 'Ошибка: ' + e.message;
  }
}

function switchTab(btn){
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pane-' + btn.dataset.tab).classList.add('active');
}
function buildOptions(cat, selectedName) {
  let opts = '<option value="">— выберите блюдо —</option>';
  DB[cat].forEach(it => {
    const safe = it.n.replace(/"/g,'&quot;');
    const sel = it.n === selectedName ? ' selected' : '';
    opts += '<option data-w="'+it.w+'" value="'+safe+'"'+sel+'>'+it.n+'</option>';
  });
  return opts;
}
function addRow(cat) { addRowWithData(cat, '', ''); }
function addRowWithData(cat, selectedName, weight) {
  const pane = document.getElementById('pane-'+cat);
  if (!pane) return;
  const box = pane.querySelector('.rows');
  const row = document.createElement('div');
  row.className = 'row';
  row.setAttribute('data-cat', cat);
  const currentCount = document.getElementById('cntTotal').value || '';
  row.innerHTML = '<span class="drag-handle" title="Перетащите">⋮⋮</span>'
    + '<select onchange="pick(this)">'+buildOptions(cat, selectedName)+'</select>'
    + '<input type="text" placeholder="Выход" class="w" value="'+(weight||'')+'">'
    + '<input type="number" placeholder="Кол-во" class="q" value="'+currentCount+'">'
    + '<button class="btn del" onclick="this.parentNode.remove(); recalc()">✕</button>';
  box.appendChild(row);
  makeDraggable(row);
  recalc();
}
function pick(sel) {
  const w = sel.options[sel.selectedIndex].getAttribute('data-w') || '';
  sel.parentNode.querySelector('.w').value = w;
  recalc();
}
function recalc() {
  const cnt = parseInt(document.getElementById('cntTotal').value) || 0;
  const base = parseInt(document.getElementById('pBase').value) || 0;
  const manualExtra = parseInt(document.getElementById('pExtra').value) || 0;
  document.querySelectorAll('.q').forEach(i => { i.value = cnt || ''; });
  let dessertSum = 0;
  document.querySelectorAll('.row').forEach(r => {
    if (r.getAttribute('data-cat') !== 'add') return;
    const name = r.querySelector('select').value;
    const qty = parseInt(r.querySelector('.q').value) || 0;
    if (!name || !qty) return;
    dessertSum += getDessertPrice(name) * qty;
  });
  const setSum = base * cnt;
  const manualSum = manualExtra * cnt;
  const extraSum = dessertSum + manualSum;
  document.getElementById('total').value = extraSum > 0
    ? fmtNum(setSum) + '+' + fmtNum(extraSum) + ' =' + fmtNum(setSum + extraSum)
    : fmtNum(setSum);
  updateAccMsg();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildBlankHtml() {
  const firm = esc(document.getElementById('firm').value);
  const date = esc(document.getElementById('date').value);
  const time = esc(document.getElementById('time').value);
  const pay = esc(document.getElementById('payment').value);
  const cntT = esc(document.getElementById('cntText').value);
  const base = parseInt(document.getElementById('pBase').value) || 0;
  const manualExtra = parseInt(document.getElementById('pExtra').value) || 0;
  const total = esc(document.getElementById('total').value);
  const dessertPP = dessertPerPersonTotal();
  const totalExtraPP = manualExtra + dessertPP;
  const priceText = totalExtraPP > 0 ? (base+'+'+totalExtraPP+' рублей') : (base+' рублей');

  const orderedRows = collectRowsSorted();
  let rowsHtml = '';
  orderedRows.forEach(r => {
    const name = r.querySelector('select').value;
    const w = r.querySelector('.w').value;
    const q = r.querySelector('.q').value;
    if (name) {
      const clean = cleanDishName(name);
      rowsHtml += '<tr>'
        + '<td style="border:1pt solid black;padding:1pt 4pt;font-family:\'Arial Narrow\',Arial,sans-serif;font-size:12pt;font-weight:bold;">'+esc(clean)+'</td>'
        + '<td style="border:1pt solid black;padding:1pt 4pt;text-align:center;font-family:\'Arial Narrow\',Arial,sans-serif;font-size:12pt;font-weight:bold;">'+esc(w)+'</td>'
        + '<td style="border:1pt solid black;padding:1pt 4pt;text-align:center;font-family:\'Arial Narrow\',Arial,sans-serif;font-size:12pt;font-weight:bold;">'+esc(q)+'</td>'
        + '</tr>';
    }
  });
  const F = "font-family:'Arial Narrow',Arial,sans-serif;font-size:12pt;font-weight:bold;color:#000;";
  const TH = "border:1pt solid black;padding:1pt 4pt;text-align:center;"+F;

  return ''
  + '<div style="'+F+'line-height:1.05;">'
  + '<p style="text-align:center;margin:0;">'+firm+'</p>'
  + '<p style="text-align:center;text-decoration:underline;margin:0;">Ресторанно - банкетный комплекс «Ванильное небо»</p>'
  + '<p style="text-align:center;margin:0;">ЗАЯВКА НА ПИТАНИЕ ТУРИСТОВ</p>'
  + '<p style="margin:0;">Дата: '+date+'</p>'
  + '<p style="margin:0;">Время: '+time+'</p>'
  + '<p style="margin:0;">Оплата: '+pay+'</p>'
  + '<p style="margin:0;">Кол-во: '+cntT+'</p>'
  + '<p style="margin:0;text-decoration:underline;">Обед из расчета на 1 человека: '+priceText+'</p>'
  + '<table border="0" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse;table-layout:fixed;">'
  +   '<tr><td colspan="2" style="text-align:center;text-decoration:underline;padding:0 0 3pt 0;border:none;'+F+'">Меню:</td></tr>'
  +   '<tr>'
  +     '<td style="vertical-align:top;border:none;padding:0;width:75%;">'
  +       '<table border="1" cellspacing="0" cellpadding="2" style="width:100%;border-collapse:collapse;'+F+'">'
  +         '<tr><td style="'+TH+'">Наименование</td><td style="'+TH+'width:70pt;">Выход</td><td style="'+TH+'width:80pt;">Количество</td></tr>'
  +         (rowsHtml || '<tr><td colspan="3" style="border:1pt solid black;padding:1pt 4pt;text-align:center;'+F+'">—</td></tr>')
  +       '</table>'
  +     '</td>'
  +     '<td style="vertical-align:top;border:none;padding:18pt 0 0 10pt;width:25%;'+F+'">'
  +       '<p style="margin:0;">Итого:</p><p style="margin:0;">'+total+'</p>'
  +     '</td>'
  +   '</tr>'
  + '</table>'
  + '</div>';
}

function generate() {
  const b = buildBlankHtml();
  document.getElementById('output').innerHTML =
    b + '<p style="text-align:center;color:#666;margin:14pt 0;">— — — — — линия реза — — — — —</p>' + b;
  document.getElementById('preview').style.display = 'block';
  document.getElementById('preview').scrollIntoView({behavior:'smooth'});
}

function downloadWord() {
  const b = buildBlankHtml();
  const body = b + '<p style="text-align:center;color:#666;margin:10pt 0;">— — — — — — — — — — линия реза — — — — — — — — — —</p>' + b;
  const html = ''
  + '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
  + '<head><meta charset="utf-8"><title>Заявка</title>'
  + '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->'
  + '<style>'
  + '@page WordSection1 { size: 21.0cm 29.7cm; mso-page-orientation: portrait; margin: 0.8cm 1.0cm 0.8cm 1.0cm; }'
  + 'div.WordSection1 { page: WordSection1; }'
  + 'body { font-family: "Arial Narrow", Arial, sans-serif; font-size: 12pt; font-weight: bold; color: #000; margin: 0; }'
  + 'p { margin: 0; line-height: 1.05; } table { border-collapse: collapse; }'
  + 'td, th { font-family: "Arial Narrow", Arial, sans-serif; font-size: 12pt; font-weight: bold; }'
  + '</style></head><body><div class="WordSection1">'+body+'</div></body></html>';
  const firm = (document.getElementById('firm').value || 'Заявка').trim();
  const date = (document.getElementById('date').value || '').trim();
  const safeFirm = firm.replace(/[\\\/:*?"<>|]+/g,'_');
  const fileName = (date ? date+' ' : '') + safeFirm + '.doc';
  const blob = new Blob(['\ufeff', html], {type:'application/msword;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  generate();
  alert('Файл «'+fileName+'» скачан.');
}

async function copyResult() {
  const node = document.getElementById('output');
  if (!node.innerHTML.trim()) generate();
  const html = '<html><head><meta charset="utf-8"></head><body>' + document.getElementById('output').innerHTML + '</body></html>';
  const text = document.getElementById('output').innerText;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      const item = new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([text], {type:'text/plain'})
      });
      await navigator.clipboard.write([item]);
      alert('Скопировано!'); return;
    }
  } catch (e) {}
  const range = document.createRange(); range.selectNodeContents(node);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  try { document.execCommand('copy'); alert('Скопировано.'); } catch (e) { alert('Не удалось.'); }
  sel.removeAllRanges();
}
addRow('main');
recalc();
